<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mustafa Ahmed, AI agent and backend engineer">
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 74px 62px; }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1) } 50% { opacity: 0; transform: scale(2.2) } }
    .orb1 { animation: drift1 14s ease-in-out infinite alternate; }
    .orb2 { animation: drift2 18s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(-60px, 40px) } }
    @keyframes drift2 { to { transform: translate(50px, -30px) } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
  </style>
  <defs>
    <clipPath id="c"><rect width="1200" height="420" rx="18"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <radialGradient id="g1"><stop offset="0" stop-color="#6366F1" stop-opacity=".55"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#22D3EE" stop-opacity=".35"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#A5B4FC"/><stop offset=".5" stop-color="#67E8F9"/><stop offset="1" stop-color="#6EE7B7"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".18"/><stop offset="1" stop-color="#ffffff" stop-opacity=".04"/></linearGradient>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1200" height="420" fill="#0A0C12"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <circle class="orb1" cx="980" cy="60" r="360" fill="url(#g1)"/>
    <circle class="orb2" cx="760" cy="440" r="300" fill="url(#g2)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="419" rx="17.5" fill="none" stroke="url(#edge)"/>

  <!-- status pill -->
  <g>
    <rect x="56" y="46" width="236" height="32" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".1"/>
    <circle class="pulse" cx="74" cy="62" r="5" fill="#34D399"/>
    <circle cx="74" cy="62" r="4.5" fill="#34D399"/>
    <text x="88" y="67" class="sans" font-size="13.5" fill="#CBD5E1">Lahore, PK · Remote · GMT+5</text>
  </g>

  <text x="54" y="160" class="sans" font-size="68" font-weight="700" fill="#F8FAFC" letter-spacing="-2">Mustafa Ahmed</text>
  <text x="56" y="206" class="sans" font-size="26" font-weight="600" fill="url(#title)" letter-spacing="-.3">AI Agent &amp; Backend Engineer</text>

  <g class="sans" font-size="16.5" fill="#94A3B8">
    <text x="56" y="252">Mostly working on what sits between AI agents and the</text>
    <text x="56" y="278">systems they touch: access control, metering, rate limits, audit.</text>
  </g>

  <g class="mono" font-size="12.5" fill="#64748B" letter-spacing="1.2">
    <line x1="56" y1="326" x2="600" y2="326" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="56" y="360">RUST · GO · PYTHON · .NET · TYPESCRIPT</text>
    <text x="56" y="382">POSTGRES · REDIS · KUBERNETES · TERRAFORM · AWS · AZURE</text>
  </g>

  <!-- terminal -->
  <g>
    <rect x="690" y="70" width="456" height="290" rx="12" fill="#0F131C" fill-opacity=".92" stroke="#ffffff" stroke-opacity=".1"/>
    <path d="M690 82a12 12 0 0 1 12-12h432a12 12 0 0 1 12 12v22H690z" fill="#ffffff" fill-opacity=".03"/>
    <circle cx="712" cy="87" r="5" fill="#FF5F57"/><circle cx="730" cy="87" r="5" fill="#FEBC2E"/><circle cx="748" cy="87" r="5" fill="#28C840"/>
    <text x="918" y="91" class="mono" font-size="11.5" fill="#64748B" text-anchor="middle">warden — tool-call audit</text>
  </g>
  <g class="mono" font-size="13">
    <text x="712" y="136"><tspan fill="#34D399">$</tspan><tspan fill="#E2E8F0"> agent.call("run_vouch", engagement="coke-26")</tspan></text>
    <text x="712" y="166"><tspan fill="#64748B">  identity  </tspan><tspan fill="#E2E8F0">sara@firm  </tspan><tspan fill="#34D399">✓</tspan></text>
    <text x="712" y="190"><tspan fill="#64748B">  scope     </tspan><tspan fill="#E2E8F0">vouch:run  </tspan><tspan fill="#34D399">✓</tspan></text>
    <text x="712" y="214"><tspan fill="#64748B">  wall      </tspan><tspan fill="#E2E8F0">none       </tspan><tspan fill="#34D399">✓</tspan></text>
    <text x="712" y="238"><tspan fill="#64748B">  token     </tspan><tspan fill="#E2E8F0">1 tool · 60s</tspan></text>
    <text x="712" y="270"><tspan fill="#A5B4FC">→ ALLOW</tspan><tspan fill="#64748B">   logged</tspan></text>
    <text x="712" y="306"><tspan fill="#34D399">$</tspan><tspan fill="#E2E8F0"> agent.call("export_documents")</tspan></text>
    <text x="712" y="332"><tspan fill="#F87171">✗ DENY</tspan><tspan fill="#64748B">    unknown tool </tspan><tspan class="caret" fill="#E2E8F0">▍</tspan></text>
  </g>
</svg>
