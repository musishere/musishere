<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LLM Gateway — one front door between apps and Claude">
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .flow { stroke-dasharray: 4 6; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -20 } }
    .bar { animation: fill 3.2s ease-in-out infinite; transform-origin: 916px 0; }
    @keyframes fill { 0% { transform: scaleX(.15) } 60%,100% { transform: scaleX(1) } }
  </style>
  <defs>
    <clipPath id="c"><rect width="1200" height="360" rx="18"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0F172A" stroke-opacity=".035"/></pattern>
    <radialGradient id="g"><stop offset="0" stop-color="#F97316" stop-opacity="0.14"/><stop offset="1" stop-color="#F97316" stop-opacity="0"/></radialGradient>
    <linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#EA580C"/><stop offset="1" stop-color="#DB2777"/></linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="360" fill="#FFFFFF"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="960" cy="180" r="340" fill="url(#g)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="17.5" fill="none" stroke="#0F172A" stroke-opacity=".1"/>
  <rect x="0" y="40" width="3" height="56" rx="1.5" fill="url(#a)"/>

  <text x="56" y="62" class="mono" font-size="12.5" fill="#EA580C" letter-spacing="1.6">02 · AI PLATFORM ENGINEERING</text>
  <text x="54" y="112" class="sans" font-size="44" font-weight="700" fill="#0F172A" letter-spacing="-1.2">LLM Gateway</text>
  <g class="sans" font-size="17" fill="#475569">
    <text x="56" y="148">One front door between apps and Claude: per-tenant keys, honest</text>
    <text x="56" y="172">streaming metering, and race-free rate limits and quotas in Redis.</text>
  </g>

  <g class="sans">
    <text x="56" y="232" font-size="30" font-weight="700" fill="url(#a)">0</text>
    <text x="56" y="254" font-size="13" fill="#64748B">overshoot, 20 concurrent</text>
    <text x="256" y="232" font-size="30" font-weight="700" fill="url(#a)">0</text>
    <text x="256" y="254" font-size="13" fill="#64748B">SDK code changes</text>
    <text x="426" y="232" font-size="30" font-weight="700" fill="url(#a)">SSE</text>
    <text x="426" y="254" font-size="13" fill="#64748B">metered mid-stream</text>
  </g>

  <g class="mono" font-size="12" fill="#334155">
    <rect x="56" y="284" width="76" height="28" rx="14" fill="#0F172A" fill-opacity=".05" stroke="#0F172A" stroke-opacity=".1"/><text x="94" y="302" text-anchor="middle">FastAPI</text>
    <rect x="140" y="284" width="98" height="28" rx="14" fill="#0F172A" fill-opacity=".05" stroke="#0F172A" stroke-opacity=".1"/><text x="189" y="302" text-anchor="middle">Redis · Lua</text>
    <rect x="246" y="284" width="90" height="28" rx="14" fill="#0F172A" fill-opacity=".05" stroke="#0F172A" stroke-opacity=".1"/><text x="291" y="302" text-anchor="middle">Terraform</text>
    <rect x="344" y="284" width="80" height="28" rx="14" fill="#0F172A" fill-opacity=".05" stroke="#0F172A" stroke-opacity=".1"/><text x="384" y="302" text-anchor="middle">Argo CD</text>
    <rect x="432" y="284" width="96" height="28" rx="14" fill="#0F172A" fill-opacity=".05" stroke="#0F172A" stroke-opacity=".1"/><text x="480" y="302" text-anchor="middle">OCI · OKE</text>
    <rect x="536" y="284" width="88" height="28" rx="14" fill="#0F172A" fill-opacity=".05" stroke="#0F172A" stroke-opacity=".1"/><text x="580" y="302" text-anchor="middle">Claude API</text>
  </g>

  <!-- diagram: apps → gateway pipeline → claude -->
  <g class="mono" font-size="12">
    <rect x="716" y="88" width="96" height="34" rx="8" fill="#F6F8FA" stroke="#0F172A" stroke-opacity=".14"/><text x="764" y="109" text-anchor="middle" fill="#334155">tenant A</text>
    <rect x="716" y="134" width="96" height="34" rx="8" fill="#F6F8FA" stroke="#0F172A" stroke-opacity=".14"/><text x="764" y="155" text-anchor="middle" fill="#334155">tenant B</text>
    <rect x="716" y="180" width="96" height="34" rx="8" fill="#F6F8FA" stroke="#0F172A" stroke-opacity=".14"/><text x="764" y="201" text-anchor="middle" fill="#334155">tenant C</text>
    <path class="flow" d="M812 105L848 140M812 151H848M812 197L848 162" stroke="#EA580C" stroke-width="1.5" fill="none"/>

    <rect x="848" y="72" width="182" height="160" rx="14" fill="#F97316" fill-opacity=".08" stroke="#EA580C" stroke-opacity=".45"/>
    <text x="939" y="96" text-anchor="middle" fill="#0F172A" font-weight="600">gateway</text>
    <text x="866" y="124" fill="#475569">auth</text><text x="1012" y="124" fill="#059669" text-anchor="end">hash ✓</text>
    <text x="866" y="148" fill="#475569">bucket</text><text x="1012" y="148" fill="#059669" text-anchor="end">reserve</text>
    <text x="866" y="172" fill="#475569">quota</text>
    <rect x="916" y="164" width="96" height="8" rx="4" fill="#0F172A" fill-opacity=".08"/>
    <rect class="bar" x="916" y="164" width="96" height="8" rx="4" fill="url(#a)"/>
    <text x="866" y="208" fill="#475569">meter</text><text x="1012" y="208" fill="#EA580C" text-anchor="end">SSE ⟶ $</text>

    <path class="flow" d="M1030 152H1066" stroke="#EA580C" stroke-width="1.5" fill="none"/>
    <rect x="1066" y="128" width="88" height="48" rx="10" fill="#F6F8FA" stroke="#EA580C" stroke-opacity=".4"/>
    <text x="1110" y="157" text-anchor="middle" fill="#EA580C" font-weight="600">Claude</text>

    <text x="939" y="268" text-anchor="middle" fill="#94A3B8" font-size="11">reserve-then-settle · client_disconnected metering</text>
    <text x="939" y="288" text-anchor="middle" fill="#94A3B8" font-size="11">20 requests, 100 tokens left → 4 admitted</text>
  </g>
</svg>
