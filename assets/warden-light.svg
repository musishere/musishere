<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Warden — identity and access for AI agents">
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .flow { stroke-dasharray: 4 6; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -20 } }
    .glow { animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 50% { opacity: .45 } }
  </style>
  <defs>
    <clipPath id="c"><rect width="1200" height="360" rx="18"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0F172A" stroke-opacity=".035"/></pattern>
    <radialGradient id="g"><stop offset="0" stop-color="#10B981" stop-opacity="0.16"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
    <linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#0891B2"/></linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="360" fill="#FFFFFF"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="960" cy="180" r="340" fill="url(#g)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="17.5" fill="none" stroke="#0F172A" stroke-opacity=".1"/>
  <rect x="0" y="40" width="3" height="56" rx="1.5" fill="url(#a)"/>

  <text x="56" y="62" class="mono" font-size="12.5" fill="#059669" letter-spacing="1.6">01 · OPEN SOURCE · APACHE-2.0</text>
  <text x="54" y="112" class="sans" font-size="44" font-weight="700" fill="#0F172A" letter-spacing="-1.2">Warden</text>
  <g class="sans" font-size="17" fill="#475569">
    <text x="56" y="148">MCP gateway that checks every tool call an AI agent makes against</text>
    <text x="56" y="172">the firm's rules, and records each decision in an append-only log.</text>
  </g>

  <g class="sans">
    <text x="56" y="232" font-size="30" font-weight="700" fill="url(#a)">7</text>
    <text x="56" y="254" font-size="13" fill="#64748B">checks on every call</text>
    <text x="236" y="232" font-size="30" font-weight="700" fill="url(#a)">60s</text>
    <text x="236" y="254" font-size="13" fill="#64748B">one-tool tokens</text>
    <text x="406" y="232" font-size="30" font-weight="700" fill="url(#a)">15m</text>
    <text x="406" y="254" font-size="13" fill="#64748B">agent pass, one engagement</text>
  </g>

  <g class="mono" font-size="12" fill="#334155">
    <rect x="56" y="284" width="82" height="28" rx="14" fill="#0F172A" fill-opacity=".05" stroke="#0F172A" stroke-opacity=".1"/><text x="97" y="302" text-anchor="middle">.NET 10</text>
    <rect x="146" y="284" width="98" height="28" rx="14" fill="#0F172A" fill-opacity=".05" stroke="#0F172A" stroke-opacity=".1"/><text x="195" y="302" text-anchor="middle">PostgreSQL</text>
    <rect x="252" y="284" width="104" height="28" rx="14" fill="#0F172A" fill-opacity=".05" stroke="#0F172A" stroke-opacity=".1"/><text x="304" y="302" text-anchor="middle">Entra ID</text>
    <rect x="364" y="284" width="64" height="28" rx="14" fill="#0F172A" fill-opacity=".05" stroke="#0F172A" stroke-opacity=".1"/><text x="396" y="302" text-anchor="middle">MCP</text>
    <rect x="436" y="284" width="70" height="28" rx="14" fill="#0F172A" fill-opacity=".05" stroke="#0F172A" stroke-opacity=".1"/><text x="471" y="302" text-anchor="middle">React</text>
    <rect x="514" y="284" width="96" height="28" rx="14" fill="#0F172A" fill-opacity=".05" stroke="#0F172A" stroke-opacity=".1"/><text x="562" y="302" text-anchor="middle">Azure ACA</text>
  </g>

  <!-- diagram: agent → warden → tools, audit below -->
  <g class="mono" font-size="12">
    <path class="flow" d="M836 150H900" stroke="#059669" stroke-width="1.5" fill="none"/>
    <path class="flow" d="M1020 130L1060 96M1020 150H1060M1020 170L1060 204" stroke="#059669" stroke-width="1.5" fill="none"/>
    <path class="flow" d="M960 196V244" stroke="#64748B" stroke-width="1.5" fill="none"/>

    <rect x="716" y="126" width="120" height="48" rx="10" fill="#F6F8FA" stroke="#0F172A" stroke-opacity=".14"/>
    <text x="776" y="155" text-anchor="middle" fill="#1E293B">AI agent</text>

    <rect class="glow" x="896" y="100" width="128" height="100" rx="14" fill="#10B981" fill-opacity=".12" stroke="#059669" stroke-opacity=".5"/>
    <path d="M960 118l18 7v13c0 11-8 19-18 23-10-4-18-12-18-23v-13z" fill="none" stroke="#059669" stroke-width="2"/>
    <path d="M952 140l6 6 11-12" fill="none" stroke="#059669" stroke-width="2"/>
    <text x="960" y="184" text-anchor="middle" fill="#0F172A" font-weight="600">Warden</text>

    <rect x="1060" y="78" width="92" height="36" rx="8" fill="#F6F8FA" stroke="#0F172A" stroke-opacity=".14"/><text x="1106" y="100" text-anchor="middle" fill="#334155">tickmark</text>
    <rect x="1060" y="132" width="92" height="36" rx="8" fill="#F6F8FA" stroke="#0F172A" stroke-opacity=".14"/><text x="1106" y="154" text-anchor="middle" fill="#334155">docs</text>
    <rect x="1060" y="186" width="92" height="36" rx="8" fill="#F6F8FA" stroke="#DC2626" stroke-opacity=".5" stroke-dasharray="3 3"/><text x="1106" y="208" text-anchor="middle" fill="#DC2626">export ✗</text>

    <rect x="896" y="244" width="128" height="40" rx="8" fill="#F6F8FA" stroke="#0F172A" stroke-opacity=".14"/>
    <text x="960" y="268" text-anchor="middle" fill="#475569">audit log</text>
    <text x="960" y="316" text-anchor="middle" fill="#94A3B8" font-size="11">ethical walls · SCIM off-switch · injection-safe</text>
  </g>
</svg>
