<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What I'm working on: shipped, now, next">
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 436px 112px; }
    @keyframes pulse { 0%,100% { opacity: .4; transform: scale(1) } 50% { opacity: 0; transform: scale(2.6) } }
    .flow { stroke-dasharray: 4 6; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -20 } }
  </style>
  <defs>
    <clipPath id="c"><rect width="1200" height="300" rx="18"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <radialGradient id="g"><stop offset="0" stop-color="#6366F1" stop-opacity=".3"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#A5B4FC"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="300" fill="#0A0C12"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="436" cy="40" r="380" fill="url(#g)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="17.5" fill="none" stroke="#fff" stroke-opacity=".1"/>
  <rect x="0" y="40" width="3" height="40" rx="1.5" fill="url(#a)"/>

  <text x="56" y="66" class="mono" font-size="12.5" fill="#A5B4FC" letter-spacing="1.6">WHAT I'M WORKING ON</text>

  <!-- timeline -->
  <line x1="56" y1="112" x2="436" y2="112" stroke="#6EE7B7" stroke-opacity=".5" stroke-width="1.5"/>
  <path class="flow" d="M436 112H1144" stroke="#fff" stroke-opacity=".25" stroke-width="1.5" fill="none"/>
  <circle cx="56" cy="112" r="5" fill="#6EE7B7"/>
  <circle class="pulse" cx="436" cy="112" r="6" fill="#67E8F9"/>
  <circle cx="436" cy="112" r="5.5" fill="#67E8F9"/>
  <circle cx="816" cy="112" r="5" fill="#0A0C12" stroke="#94A3B8" stroke-width="1.5"/>

  <g class="mono" font-size="11.5" letter-spacing="1.2">
    <text x="56" y="148" fill="#6EE7B7">SHIPPED</text>
    <text x="436" y="148" fill="#67E8F9">NOW</text>
    <text x="816" y="148" fill="#94A3B8">NEXT</text>
  </g>

  <g class="sans">
    <text x="56" y="180" font-size="19" font-weight="600" fill="#F8FAFC">Warden as an MCP gateway</text>
    <text x="56" y="208" font-size="14.5" fill="#94A3B8">Stock Claude Code signs in through</text>
    <text x="56" y="230" font-size="14.5" fill="#94A3B8">Microsoft; admin console for walls,</text>
    <text x="56" y="252" font-size="14.5" fill="#94A3B8">agents, tool servers and audit.</text>

    <text x="436" y="180" font-size="19" font-weight="600" fill="#F8FAFC">Taking Warden live on Azure</text>
    <text x="436" y="208" font-size="14.5" fill="#94A3B8">Container Apps, managed Postgres and</text>
    <text x="436" y="230" font-size="14.5" fill="#94A3B8">Key Vault, with a network lock so</text>
    <text x="436" y="252" font-size="14.5" fill="#94A3B8">agents can only reach Warden.</text>

    <text x="816" y="180" font-size="19" font-weight="600" fill="#F8FAFC">Gateway: canaries → vLLM</text>
    <text x="816" y="208" font-size="14.5" fill="#94A3B8">Canary releases, SLOs with burn-rate</text>
    <text x="816" y="230" font-size="14.5" fill="#94A3B8">alerts, then a self-hosted model with</text>
    <text x="816" y="252" font-size="14.5" fill="#94A3B8">cost-aware routing.</text>
  </g>
</svg>
