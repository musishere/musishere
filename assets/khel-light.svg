<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Khel — turf-booking marketplace">
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .book { animation: book 6s ease-in-out infinite; }
    @keyframes book { 0%,30% { fill-opacity: .04 } 40%,100% { fill-opacity: .55 } }
    .ping { animation: ping 2s ease-in-out infinite; transform-origin: 1146px 128px; }
    @keyframes ping { 0%,100% { opacity: .5; transform: scale(1) } 50% { opacity: 0; transform: scale(2.4) } }
  </style>
  <defs>
    <clipPath id="c"><rect width="1200" height="360" rx="18"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0F172A" stroke-opacity=".035"/></pattern>
    <radialGradient id="g"><stop offset="0" stop-color="#84CC16" stop-opacity="0.13"/><stop offset="1" stop-color="#84CC16" stop-opacity="0"/></radialGradient>
    <linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#4D7C0F"/><stop offset="1" stop-color="#059669"/></linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="360" fill="#FFFFFF"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="960" cy="180" r="340" fill="url(#g)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="17.5" fill="none" stroke="#0F172A" stroke-opacity=".1"/>
  <rect x="0" y="40" width="3" height="56" rx="1.5" fill="url(#a)"/>

  <text x="56" y="62" class="mono" font-size="12.5" fill="#4D7C0F" letter-spacing="1.6">03 · CO-FOUNDER · BACKEND &amp; SYSTEMS</text>
  <text x="54" y="112" class="sans" font-size="44" font-weight="700" fill="#0F172A" letter-spacing="-1.2">Khel</text>
  <g class="sans" font-size="17" fill="#475569">
    <text x="56" y="148">Turf-booking marketplace: a conflict-safe reservation engine,</text>
    <text x="56" y="172">in-house split payments, and ELO-based skill matchmaking.</text>
  </g>

  <g class="sans">
    <text x="56" y="232" font-size="30" font-weight="700" fill="url(#a)">P2P</text>
    <text x="56" y="254" font-size="13" fill="#64748B">split payments, in-house</text>
    <text x="246" y="232" font-size="30" font-weight="700" fill="url(#a)">ELO</text>
    <text x="246" y="254" font-size="13" fill="#64748B">skill matchmaking</text>
    <text x="416" y="232" font-size="30" font-weight="700" fill="url(#a)">Go</text>
    <text x="416" y="254" font-size="13" fill="#64748B">chi · fiber services</text>
  </g>

  <g class="mono" font-size="12" fill="#334155">
    <rect x="56" y="284" width="48" height="28" rx="14" fill="#0F172A" fill-opacity=".05" stroke="#0F172A" stroke-opacity=".1"/><text x="80" y="302" text-anchor="middle">Go</text>
    <rect x="112" y="284" width="96" height="28" rx="14" fill="#0F172A" fill-opacity=".05" stroke="#0F172A" stroke-opacity=".1"/><text x="160" y="302" text-anchor="middle">chi · fiber</text>
    <rect x="216" y="284" width="98" height="28" rx="14" fill="#0F172A" fill-opacity=".05" stroke="#0F172A" stroke-opacity=".1"/><text x="265" y="302" text-anchor="middle">PostgreSQL</text>
    <rect x="322" y="284" width="66" height="28" rx="14" fill="#0F172A" fill-opacity=".05" stroke="#0F172A" stroke-opacity=".1"/><text x="355" y="302" text-anchor="middle">Redis</text>
    <rect x="396" y="284" width="112" height="28" rx="14" fill="#0F172A" fill-opacity=".05" stroke="#0F172A" stroke-opacity=".1"/><text x="452" y="302" text-anchor="middle">React Native</text>
  </g>

  <!-- diagram: booking grid + ELO curve -->
  <g class="mono" font-size="11" fill="#64748B">
    <text x="716" y="82">TURF · SAT</text>
    <text x="760" y="104" text-anchor="middle">6p</text><text x="820" y="104" text-anchor="middle">7p</text><text x="880" y="104" text-anchor="middle">8p</text><text x="940" y="104" text-anchor="middle">9p</text><text x="1000" y="104" text-anchor="middle">10p</text>
    <text x="716" y="132">A</text><text x="716" y="172">B</text><text x="716" y="212">C</text>
  </g>
  <g stroke="#0F172A" stroke-opacity=".1">
    <rect x="734" y="114" width="52" height="28" rx="6" fill="#4D7C0F" fill-opacity=".55"/>
    <rect x="794" y="114" width="52" height="28" rx="6" fill="#4D7C0F" fill-opacity=".55"/>
    <rect x="854" y="114" width="52" height="28" rx="6" fill="#0F172A" fill-opacity=".04"/>
    <rect x="914" y="114" width="52" height="28" rx="6" fill="#4D7C0F" fill-opacity=".55"/>
    <rect x="974" y="114" width="52" height="28" rx="6" fill="#0F172A" fill-opacity=".04"/>
    <rect x="734" y="154" width="52" height="28" rx="6" fill="#0F172A" fill-opacity=".04"/>
    <rect class="book" x="794" y="154" width="52" height="28" rx="6" fill="#4D7C0F"/>
    <rect x="854" y="154" width="52" height="28" rx="6" fill="#D97706" fill-opacity=".45"/>
    <rect x="914" y="154" width="52" height="28" rx="6" fill="#4D7C0F" fill-opacity=".55"/>
    <rect x="974" y="154" width="52" height="28" rx="6" fill="#0F172A" fill-opacity=".04"/>
    <rect x="734" y="194" width="52" height="28" rx="6" fill="#4D7C0F" fill-opacity=".55"/>
    <rect x="794" y="194" width="52" height="28" rx="6" fill="#0F172A" fill-opacity=".04"/>
    <rect x="854" y="194" width="52" height="28" rx="6" fill="#4D7C0F" fill-opacity=".55"/>
    <rect x="914" y="194" width="52" height="28" rx="6" fill="#0F172A" fill-opacity=".04"/>
    <rect x="974" y="194" width="52" height="28" rx="6" fill="#4D7C0F" fill-opacity=".55"/>
  </g>
  <g class="mono" font-size="11" fill="#64748B">
    <rect x="734" y="240" width="10" height="10" rx="2" fill="#4D7C0F" fill-opacity=".55"/><text x="750" y="249">booked</text>
    <rect x="808" y="240" width="10" height="10" rx="2" fill="#D97706" fill-opacity=".45"/><text x="824" y="249">held · partial pay</text>
  </g>

  <g class="mono" font-size="11">
    <text x="1060" y="82" fill="#64748B">PLAYER ELO</text>
    <rect x="1056" y="96" width="100" height="126" rx="8" fill="#F6F8FA" stroke="#0F172A" stroke-opacity=".12"/>
    <path d="M1066 200L1080 190L1092 196L1106 170L1118 176L1132 144L1146 128" fill="none" stroke="url(#a)" stroke-width="2"/>
    <circle class="ping" cx="1146" cy="128" r="4" fill="#4D7C0F"/><circle cx="1146" cy="128" r="3.5" fill="#4D7C0F"/>
    <text x="1138" y="116" text-anchor="end" fill="#4D7C0F">1642</text>
  </g>
  <text x="939" y="300" class="mono" font-size="11" fill="#94A3B8" text-anchor="middle">conflict-safe holds · payment deadlines · badges &amp; streaks</text>
</svg>
